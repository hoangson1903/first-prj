spring.application.name=macmoc-api
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/macmoc}
spring.data.mongodb.auto-index-creation=true
server.port=${PORT:8080}
server.error.include-message=always
app.jwt.secret=${APP_JWT_SECRET:local-development-only-secret-change-before-deploy-2026}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:43200000}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Quản trị viên}
